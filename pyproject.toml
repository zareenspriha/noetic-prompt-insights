[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utd-2-prompt-insights"
version = "0.1.0"
description = "Runnable Noetic Hackathon starter"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3", "scikit-learn>=1.5,<1.9", "streamlit>=1.40,<2", "jsonschema>=4,<5", "sentence-transformers>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
